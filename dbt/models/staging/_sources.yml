version: 2

anchors:
  - &snowflake_only
    enabled: "{{ target.type == 'snowflake' }}"

# Silver sources: native device snapshots by default, or compatible-storage Iceberg.
# On DuckDB the macros read the files directly, so the source and its tests stay disabled.
sources:
  - name: lake
    database: OUTFORDELIVERY
    schema: LAKE
    config: *snowflake_only
    tables:
      - name: silver_parcel_events
        description: "Validated, deduplicated Silver events; event_ts retains the original UTC event time."
        config:
          loaded_at_query: "{{ 'select max(loaded_at) from OUTFORDELIVERY.LAKE.LOAD_AUDIT' if var('source_mode', 'native') == 'native' else 'select max(event_ts) from OUTFORDELIVERY.LAKE.SILVER_PARCEL_EVENTS' }}"
          freshness:
            warn_after: {count: 1, period: hour}
            error_after: {count: 24, period: hour}
        columns:
          - name: event_id
            data_tests:
              - not_null:
                  config: *snowflake_only
              - unique:
                  config: *snowflake_only
          - name: event_type
            data_tests:
              - accepted_values:
                  arguments:
                    values:
                      [
                        CREATED, LABEL_PRINTED, COLLECTED, AT_SORTING_HUB, IN_TRANSIT,
                        OUT_FOR_DELIVERY, DELIVERED, DELIVERY_FAILED, RESCHEDULED, RETURNED,
                      ]
                  config: *snowflake_only
      - name: silver_parcels
        description: "One row per parcel with the dimensions from the same published Silver snapshot."
        config:
          loaded_at_query: "{{ 'select max(loaded_at) from OUTFORDELIVERY.LAKE.LOAD_AUDIT' if var('source_mode', 'native') == 'native' else 'select max(created_at) from OUTFORDELIVERY.LAKE.SILVER_PARCELS' }}"
          freshness:
            warn_after: {count: 1, period: hour}
            error_after: {count: 24, period: hour}
        columns:
          - name: parcel_id
            data_tests:
              - not_null:
                  config: *snowflake_only
              - unique:
                  config: *snowflake_only
