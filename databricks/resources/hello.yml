resources:
  jobs:
    hello:
      name: ofd-hello
      environments:
      - environment_key: default
        spec:
          environment_version: ${var.runtime_version}
          dependencies:
          - pyyaml
          - fastavro
          - boto3
          - requests
      tasks:
      - task_key: hello
        environment_key: default
        spark_python_task:
          python_file: ../jobs/hello.py
          parameters:
          - --repo
          - ${workspace.file_path}
          - --catalog
          - ${var.catalog}
          - --secret-scope
          - ${var.secret_scope}
      max_concurrent_runs: 1
      queue:
        enabled: true
